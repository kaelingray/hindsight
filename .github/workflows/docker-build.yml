name: Docker Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/hindsight

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        target: [ standalone, api-only, cp-only ]
        include:
          - target: standalone
            tag-suffix: ""
          - target: api-only
            tag-suffix: "-api"
          - target: cp-only
            tag-suffix: "-cp"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.tag-suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.tag-suffix }}
            type=sha,prefix={{branch}}-,suffix=${{ matrix.tag-suffix }}

      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@v5
        with:
          context: hindsight/docker/standalone
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INCLUDE_LOCAL_MODELS=true
            PRELOAD_ML_MODELS=${{ github.event_name == 'push' && 'true' || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test build on PR (minimal, no ML preload)
        if: github.event_name == 'pull_request' && matrix.target == 'standalone'
        run: |
          docker build --target standalone \
            --build-arg INCLUDE_LOCAL_MODELS=true \
            --build-arg PRELOAD_ML_MODELS=false \
            -t hindsight:test \
            ./hindsight/docker/standalone
          echo "Image size:"
          docker image ls hindsight:test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: hindsight/docker/standalone/Dockerfile
          ignore: DL3008,DL3009,DL3058
